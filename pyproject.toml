[project]
name = "jev-ultrafast"
version = "0.2.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.optional-dependencies]
# document parsing for the parse_document tool: pip install -e ".[documents]"
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4"]
# the open System-1 decision engine (local mission routing + skill picking)
laya = ["laya>=0.3,<1"]

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-firefox = "jev_ultrafast.firefox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
