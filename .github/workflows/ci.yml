name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[documents]" pytest ruff "httpx[http2]" browser-harness==0.1.13
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: JS syntax
        run: |
          node --check jev_ultrafast/static/app.js
          node --check jev_ultrafast/snapshot.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/sidebar/sidebar.js
