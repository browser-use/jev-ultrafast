name: Executor duel

# Real head-to-head: GPT-OSS-20B on Groq (repo secret) vs local Laya weights,
# on the agent's two decision jobs — mission routing and element picking.
# A measurement, not a gate: results are commented on the PR.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/duel.yml"
      - "scripts/duel_gptoss_vs_laya.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  duel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the Laya weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-weights-multilingual-v1
      - name: Install (CPU torch first, so the runner stays light)
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -e ".[laya]" "httpx[http2]" browser-harness==0.1.13
      - name: Run the duel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLICY_PROVIDER: groq
          POLICY_MODEL: openai/gpt-oss-20b
          POLICY_REASONING: low
          LAYA_CHECKPOINT: multilingual
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "No GROQ_API_KEY secret — the GPT-OSS-20B side cannot run; duel skipped."
            exit 0
          fi
          python scripts/duel_gptoss_vs_laya.py | tee /tmp/report.md
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/report.md ]; then
            gh pr comment 1 --body-file /tmp/report.md || true
          fi
